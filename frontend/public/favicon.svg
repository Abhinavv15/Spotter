<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Obsidian Base -->
  <rect width="64" height="64" rx="18" fill="#080D0A" />
  
  <!-- Outer Subtle Glowing Border -->
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="#8AE922" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Outer Hexagonal Shield Path -->
  <path
    d="M32 8L52 19.5V44.5L32 56L12 44.5V19.5L32 8Z"
    stroke="url(#spotter_fav_grad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- High-Speed Highway Route Waves (Geometric 'S') -->
  <path
    d="M44 22C44 22 36 19 26 24C16 29 18 39 32 39C44 39 46 48 36 53C26 58 18 55 18 55"
    stroke="url(#spotter_fav_grad)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center Spotter Radar Target Reticle / Core Beacon -->
  <circle cx="32" cy="32" r="4.5" fill="#8AE922" />
  <circle cx="32" cy="32" r="9" stroke="#8AE922" stroke-width="2" stroke-dasharray="3 3" opacity="0.85" />

  <!-- Color Gradient -->
  <defs>
    <linearGradient id="spotter_fav_grad" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8AE922" />
      <stop offset="0.6" stop-color="#4ADE80" />
      <stop offset="1" stop-color="#10B981" />
    </linearGradient>
  </defs>
</svg>